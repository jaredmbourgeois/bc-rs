# The canonical tree: every key a definition file defines, across three modules. This root is
# the module `store_server`, split over two included files; `services/payments` and
# `services/payments/ledger` are modules of their own. The committed tree under
# `generated/telemetry/` is the generator's golden output, regenerated by running
# `bc-telemetry-gen` in this directory; the suite asserts it is fresh.
include = ["telemetry/*.toml"]

[module]
name = "store_server"
schema_version = 1

[generate]
output = "generated/telemetry"
dialects = ["postgresql"]
exports = ["grafana"]
languages = ["cpp", "rust"]

[generate.grafana]
datasource = "telemetry"

[span.checkout]
description = "One checkout flow, cart to confirmation"
kind = "server"
attributes = { cart_id = "string", item_count = "int" }
events = ["payment_authorized", "inventory_reserved"]

[span.refund]
description = "A refund, from request to settlement"
attributes = { order_id = "digest", amount = "float", partial = "bool", settle_time = "duration" }
